<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuildCrew.AI: Pre-construction</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@400;700&family=Figtree:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* extra inline styles specific to App shell */
    .ai-pill[disabled] { opacity: 0.6; cursor: not-allowed; }
    .greet .ai-pill { background: var(--gradient-ai); }
    .feed-item .body b { font-weight: 700; }
  </style>
</head>
<body data-theme="dark">
  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data + components — ?v= is a cache-buster; bump when JSX changes and the browser stubbornly serves the old compile -->
  <script src="data.js?v=20"></script>
  <script type="text/babel" src="components.jsx?v=20"></script>
  <script type="text/babel" src="screens-1.jsx?v=20"></script>
  <script type="text/babel" src="screens-2.jsx?v=20"></script>
  <script type="text/babel" src="screens-3.jsx?v=20"></script>
  <script type="text/babel" src="screens-4.jsx?v=20"></script>
  <script type="text/babel" src="screens-modals.jsx?v=20"></script>
  <script type="text/babel" src="screens-tabs.jsx?v=20"></script>
  <script type="text/babel" src="tweaks-panel.jsx?v=20"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "hybrid",
      "density": "regular",
      "aiPlacement": "floating",
      "homeAccent": "raisin",
      "divisionFormat": "masterformat",
      "divisionFormatOther": ""
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // ---- TABS — every navigable destination is a tab ----
      // Each tab: { id, kind, screen, ctx, label, icon, projectId?, runStatus?, runProgress? }
      const initialTab = {
        id: "t-home",
        kind: "static",
        screen: "home",
        ctx: { section: "overview" },
        label: "Home",
        icon: "home"
      };
      const [tabs, setTabs] = useState([initialTab]);
      const [activeTabId, setActiveTabId] = useState("t-home");
      const [tabHistory, setTabHistory] = useState([]); // recently visited stack
      const [aiOpen, setAiOpen] = useState(true);
      const [navCollapsed, setNavCollapsed] = useState(false);
      const toggleNavCollapsed = () => setNavCollapsed(v => !v);
      // Tracks the panel state before entering a Drawing tab so we can restore
      // exactly what the user had configured when they leave. `null` means we
      // are NOT currently overriding anything.
      const drawingPrevPanelsRef = React.useRef(null);
      // Fresh-user demo mode — set early so seeded state can also clear out.
      // Toggle via ?demo=fresh in the URL or the user-menu toggle in the nav.
      const freshMode = typeof window !== "undefined" && /(\?|&)demo=fresh\b/i.test(window.location.search || "");
      // Any time the fresh demo is explicitly requested, treat it as a hard
      // reset: clear the persisted "FUX done" + "coachmark tour seen" flags so
      // onboarding actually re-runs. Without this, once a user completed the
      // FUX in a prior session, ?demo=fresh would silently skip it.
      if (freshMode && typeof localStorage !== "undefined") {
        try {
          localStorage.removeItem("bc_fux_done");
          localStorage.removeItem("bc_fux_coachmarks_done");
          Object.keys(localStorage).filter(k => k.startsWith("bc_tour_seen_")).forEach(k => localStorage.removeItem(k));
        } catch (e) {}
      }
      const toggleFreshMode = () => {
        const url = new URL(window.location.href);
        if (freshMode) url.searchParams.delete("demo");
        else url.searchParams.set("demo", "fresh");
        window.location.href = url.toString();
      };
      // While the entire FUX sequence is running (video → welcome → questions
      // → thanks) both side panels collapse to 0 so the user focuses on the
      // onboarding canvas. After the user lands on the Home screen the panels
      // slide back to their normal widths using the same panel-shift easing
      // as the nav/AI collapse-expand transition.
      const [fuxPanelsHidden, setFuxPanelsHidden] = useState(freshMode);
      const onFuxFullyComplete = (answers) => {
        setFuxPanelsHidden(false);
        // Persist the Division formatting choice the user picked in the FUX
        // so the rest of the platform (Takeoffs, estimates, reports) groups
        // and labels by that format from this session onward.
        if (answers && answers.divisionFormat) {
          setTweak("divisionFormat", answers.divisionFormat);
          if (answers.divisionFormat === "other" && answers.divisionFormatOther) {
            setTweak("divisionFormatOther", answers.divisionFormatOther);
          }
        }
      };
      const [pinned, setPinned] = useState(new Set(freshMode ? [] : [
        "rec-wellness",
        "rivergrove",
        "skill:rec-wellness/estimation", // ROM estimate result that just finished
        "drawing:rec-wellness/A-101",    // Most-viewed sheet (Level 1 floor plan)
      ]));
      const [showNewProject, setShowNewProject] = useState(false);
      const [showDailyReport, setShowDailyReport] = useState(false);
      // Global Edit Mode + edits store. Edits are keyed by string so we can revert by key.
      const [editMode, setEditMode] = useState(false);
      const [edits, setEdits] = useState({}); // { [key]: { original, value, label? } }
      const [showPushGlobal, setShowPushGlobal] = useState(false);
      const [globalPushedAt, setGlobalPushedAt] = useState(null); // timestamp of last push
      const recordEdit = (key, original, value, label) => {
        setEdits(prev => {
          // If value === original, drop the entry
          if (value === original) {
            const n = { ...prev }; delete n[key]; return n;
          }
          return { ...prev, [key]: { original, value, label } };
        });
      };
      const revertEdits = () => setEdits({});
      const confirmPushGlobal = () => {
        setGlobalPushedAt(Date.now());
        setEdits({});
        setEditMode(false);
        setShowPushGlobal(false);
      };
      const editCount = Object.keys(edits).length;
      // key: "projectId/skillId" → { startTime, progress }
      // Seeded so the Mercy Outpatient Clinic ROM card shows a loading state at
      // 42%, matching its "running · 42%" Recent Skill Run line item. `static`
      // means no timer drives it — it just holds at 42% conceptually.
      const [skillRuns, setSkillRuns] = useState(freshMode ? {} : {
        "mercy-clinic/estimation": { progress: 42, static: true },
      });
      const [skillCompletions, setSkillCompletions] = useState({}); // key → { completedAt, justCompleted }
      const skillRunTimers = React.useRef({});
      const SKILL_RUN_DURATION = 7000;
      const CELEBRATION_MS = 1500;
      const startSkillRunCard = (projectId, skillId) => {
        const key = projectId + "/" + skillId;
        if (skillRuns[key]) return;
        const startTime = Date.now();
        setSkillRuns(prev => ({ ...prev, [key]: { startTime, progress: 0 } }));
        skillRunTimers.current[key] = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(100, (elapsed / SKILL_RUN_DURATION) * 100);
          setSkillRuns(prev => prev[key] ? ({ ...prev, [key]: { ...prev[key], progress } }) : prev);
          if (elapsed >= SKILL_RUN_DURATION) {
            clearInterval(skillRunTimers.current[key]);
            delete skillRunTimers.current[key];
            setSkillRuns(prev => { const n = { ...prev }; delete n[key]; return n; });
            // Mark completion and trigger celebration animation
            setSkillCompletions(prev => ({ ...prev, [key]: { completedAt: Date.now(), justCompleted: true } }));
            // Running a skill IS an edit event — the result is a draft
            // until the user pushes it to Master.
            const skillNames = { estimation: "ROM Estimate", rfc: "Clarifications & RFIs", bid: "Bid Level Analysis", trades: "Trade Scoping" };
            triggerEditEvent(projectId, { kind: "skill_run", label: (skillNames[skillId] || "Skill") + " completed (draft)" });
            setTimeout(() => {
              setSkillCompletions(prev => prev[key] ? ({ ...prev, [key]: { ...prev[key], justCompleted: false } }) : prev);
            }, CELEBRATION_MS);
          }
        }, 100);
      };
      const stopSkillRunCard = (projectId, skillId) => {
        const key = projectId + "/" + skillId;
        if (skillRunTimers.current[key]) {
          clearInterval(skillRunTimers.current[key]);
          delete skillRunTimers.current[key];
        }
        setSkillRuns(prev => { const n = { ...prev }; delete n[key]; return n; });
      };
      const [ctxMenu, setCtxMenu] = useState(null); // { x, y, items }
      const openCtxMenu = (items, e) => { e.preventDefault(); e.stopPropagation(); setCtxMenu({ x: e.clientX, y: e.clientY, items }); };
      const closeCtxMenu = () => setCtxMenu(null);
      const [drawingViewer, setDrawingViewer] = useState(null); // { drawing, project }

      // Strip the seeded workspace when in fresh-user mode. User identity
      // (Victor + Acme Builders) is preserved; everything else is emptied.
      const scrubData = (d) => ({
        ...d,
        projects: [],
        runs: [],
        files: [],
        filesByProject: {},
        bidConfig: {},
        bidSessions: {},
        laborRatesByProject: {},
      });
      const data = freshMode ? scrubData(window.BC_DATA) : window.BC_DATA;

      const [projects, setProjects] = useState(data.projects);
      const skills = data.skills;
      const runs = data.runs;

      // Per-project files (used by the Files workspace screen). Wrapped in state so
      // deletions update the UI immediately.
      const [filesByProject, setFilesByProject] = useState(data.filesByProject || {});

      // Per-project bid tracker rows. Populated by the "Invite to Bid" flow from
      // Trade Scoping and by manual entries on the Project Home Bid Tracker tab.
      // Shape: { [projectId]: [{ id, tradeId, tradeName, division, subName, subEmail, status, note, source }] }
      const [bidsByProject, setBidsByProject] = useState(data.bidsByProject || {});
      // Per-project override of the trade-scoping-suggested sub count.
      // Shape: { [projectId]: { [tradeId]: number } }
      const [suggestedSubsByProject, setSuggestedSubsByProject] = useState(data.suggestedSubsByProject || {});

      const addBid = (projectId, entry) => {
        const id = "bid-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1000);
        setBidsByProject(prev => ({
          ...prev,
          [projectId]: [...(prev[projectId] || []), { id, status: "invited", note: "", ...entry }]
        }));
      };
      const updateBid = (projectId, bidId, patch) => {
        setBidsByProject(prev => ({
          ...prev,
          [projectId]: (prev[projectId] || []).map(b => b.id === bidId ? { ...b, ...patch } : b)
        }));
      };
      const deleteBid = (projectId, bidId) => {
        setBidsByProject(prev => ({
          ...prev,
          [projectId]: (prev[projectId] || []).filter(b => b.id !== bidId)
        }));
      };
      const updateSuggestedCount = (projectId, tradeId, count) => {
        setSuggestedSubsByProject(prev => ({
          ...prev,
          [projectId]: { ...(prev[projectId] || {}), [tradeId]: Math.max(0, count) }
        }));
      };
      // Bulk-create bid rows when the user submits the Invite to Bid modal from
      // Trade Scoping (or the Bid Tracker's "Invite more" button).
      const submitInviteToBid = (projectId, entries) => {
        setBidsByProject(prev => ({
          ...prev,
          [projectId]: [
            ...(prev[projectId] || []),
            ...entries.map(e => ({
              id: "bid-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 10000),
              status: "invited",
              note: "",
              source: "trade-scoping",
              ...e
            }))
          ]
        }));
      };

      // Invite to Bid modal state — trades preselected on entry
      const [inviteToBidState, setInviteToBidState] = useState({ open: false, projectId: null, trades: [] });
      const openInviteToBid = (projectId, trades) => setInviteToBidState({ open: true, projectId, trades });
      const closeInviteToBid = () => setInviteToBidState({ open: false, projectId: null, trades: [] });

      // Per-project bid configuration (used by the Bid Level Analysis pre-run modal).
      const bidConfigByProject = data.bidConfig || {};
      const [showBidRunModal, setShowBidRunModal] = useState(false);
      const [bidRunProjectId, setBidRunProjectId] = useState(null);
      // When the Clipboard initiates a configurable skill run, it passes a
      // confirm callback that should fire instead of the default canvas
      // card animation. Stored in a ref to survive re-renders between
      // modal open and confirm.
      const skillConfirmRef = React.useRef(null);
      const openBidRunModal = (projectId, onConfirmOverride) => {
        setBidRunProjectId(projectId);
        skillConfirmRef.current = onConfirmOverride || null;
        setShowBidRunModal(true);
      };
      const confirmBidRun = ({ projectId, trades, assignments }) => {
        setShowBidRunModal(false);
        const override = skillConfirmRef.current;
        skillConfirmRef.current = null;
        setTimeout(() => {
          if (override) override({ projectId, trades, assignments });
          else startSkillRunCard(projectId, "bid");
        }, 80);
      };

      // ROM pre-run modal — lets users de-select divisions they don't want
      // estimated to keep the run fast and focused. Defaults to all-selected.
      const [showRomRunModal, setShowRomRunModal] = useState(false);
      const [romRunProjectId, setRomRunProjectId] = useState(null);
      const openRomRunModal = (projectId, onConfirmOverride) => {
        setRomRunProjectId(projectId);
        skillConfirmRef.current = onConfirmOverride || null;
        setShowRomRunModal(true);
      };
      const confirmRomRun = ({ projectId, divisions }) => {
        setShowRomRunModal(false);
        const override = skillConfirmRef.current;
        skillConfirmRef.current = null;
        setTimeout(() => {
          if (override) override({ projectId, divisions });
          else startSkillRunCard(projectId, "estimation");
        }, 80);
      };
      // ============================================================
      // MASTER APPROVAL WORKFLOW
      // ============================================================
      // hasPendingEdits: per-project map of open edit events. When true
      // for a given project, the taskbar surfaces the "Push to Master"
      // button on that project's screens. Wire triggerEditEvent from any
      // interaction that constitutes an edit (skill run, upload, inline
      // data change, revision, rate update).
      const [hasPendingEdits, setHasPendingEdits] = useState({}); // { [projectId]: [changeDescriptor, ...] }
      const triggerEditEvent = (projectId, change) => {
        if (!projectId) return;
        setHasPendingEdits(prev => ({
          ...prev,
          [projectId]: [...(prev[projectId] || []), change || { kind: "edit", label: "Edit event" }],
        }));
      };
      const discardEditEvent = (projectId) => {
        setHasPendingEdits(prev => { const n = { ...prev }; delete n[projectId]; return n; });
      };

      // Approval queue — seeded from BC_DATA.pendingApprovals; the
      // "Push to Master" and admin approve/deny actions mutate this
      // list. Sorted newest-first on render.
      const [approvals, setApprovals] = useState(() => (data.pendingApprovals || []).slice());
      const submitForApproval = (projectId, changes) => {
        const id = "app-" + Date.now().toString(36);
        const newEntry = {
          id, projectId,
          requestedBy: data.user && (data.user.id || "u-victor"),
          requestedByName: data.user && data.user.name,
          requestedAt: "Just now",
          dateISO: new Date().toISOString(),
          status: "pending",
          summary: changes.length === 1 ? changes[0].label : (changes.length + " changes pending approval"),
          changes,
          __submittedByCurrentUser: true,
        };
        setApprovals(prev => [newEntry, ...prev]);
        discardEditEvent(projectId);
      };
      const resolveApproval = (id, verdict, reason) => {
        setApprovals(prev => prev.map(a => a.id === id
          ? { ...a, status: verdict, resolvedBy: "u-victor", resolvedAt: "Just now", denyReason: verdict === "denied" ? (reason || "") : undefined }
          : a));
      };

      // Push-to-Master modal state.
      const [pushModal, setPushModal] = useState(null); // { projectId } | null
      const openPushToMaster = (projectId) => setPushModal({ projectId });
      const closePushToMaster = () => setPushModal(null);
      // Project-notifications popover — the bell in the Taskbar toggles it.
      const [activityPopover, setActivityPopover] = useState(null); // { projectId } | null
      const openActivityPopover = (projectId) => setActivityPopover({ projectId });
      const closeActivityPopover = () => setActivityPopover(null);

      const [pendingDelete, setPendingDelete] = useState(null); // { id, name, projectId, projectName, revisionName, ... }
      const requestDeleteFile = (file) => setPendingDelete(file);
      const confirmDeleteFile = (file) => {
        setFilesByProject(prev => {
          const list = prev[file.projectId] || [];
          return { ...prev, [file.projectId]: list.filter(f => f.id !== file.id) };
        });
        setPendingDelete(null);
      };

      const activeTab = tabs.find(tb => tb.id === activeTabId) || tabs[0];

      useEffect(() => { document.body.dataset.theme = t.theme; }, [t.theme]);

      // ---- Auto-collapse both side panels while viewing a Drawing tab ----
      // Drawings benefit from maximum horizontal space. We snapshot the panel
      // state on entry and restore exactly that state on exit so the user
      // doesn't lose their preferred sidebar layout.
      useEffect(() => {
        const isDrawing = activeTab && activeTab.kind === "drawing";
        if (isDrawing && drawingPrevPanelsRef.current === null) {
          drawingPrevPanelsRef.current = { navCollapsed, aiOpen };
          if (!navCollapsed) setNavCollapsed(true);
          if (aiOpen) setAiOpen(false);
        } else if (!isDrawing && drawingPrevPanelsRef.current !== null) {
          const prev = drawingPrevPanelsRef.current;
          drawingPrevPanelsRef.current = null;
          setNavCollapsed(prev.navCollapsed);
          setAiOpen(prev.aiOpen);
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [activeTab && activeTab.kind]);

      // ---- Track tab history (for "Recently visited" in nav) ----
      useEffect(() => {
        if (!activeTab) return;
        setTabHistory(prev => {
          const key = activeTab.id;
          const filtered = prev.filter(h => h.key !== key);
          return [{
            key,
            label: activeTab.label,
            subLabel: activeTab.subLabel,
            icon: activeTab.icon,
            running: activeTab.runStatus === "running",
            onClick: () => setActiveTabId(activeTab.id)
          }, ...filtered].slice(0, 8);
        });
      }, [activeTabId, activeTab && activeTab.runStatus, activeTab && activeTab.label]);

      // ---- Tab operations ----
      const addTab = (tab) => {
        // Dedupe by signature (kind + screen + ctx.projectId + ctx.tab) unless force=true
        if (!tab.force) {
          const sig = tab.kind + "|" + tab.screen + "|" + (tab.ctx?.projectId || "") + "|" + (tab.ctx?.tab || "") + "|" + (tab.ctx?.drawingId || "");
          const existing = tabs.find(tb => {
            const tbSig = tb.kind + "|" + tb.screen + "|" + (tb.ctx?.projectId || "") + "|" + (tb.ctx?.tab || "") + "|" + (tb.ctx?.drawingId || "");
            return tbSig === sig;
          });
          if (existing) {
            setActiveTabId(existing.id);
            return existing.id;
          }
        }
        const { force, ...clean } = tab;
        const id = clean.id || ("t-" + Date.now().toString(36));
        const next = { ...clean, id };
        setTabs(prev => [...prev, next]);
        setActiveTabId(id);
        return id;
      };

      const updateActiveTab = (patch) => {
        setTabs(prev => prev.map(tb => tb.id === activeTabId ? { ...tb, ...patch, ctx: patch.ctx || tb.ctx } : tb));
      };

      const updateTab = (tabId, patch) => {
        setTabs(prev => prev.map(tb => tb.id === tabId ? { ...tb, ...patch } : tb));
      };

      const closeTab = (tabId) => {
        setTabs(prev => {
          const idx = prev.findIndex(tb => tb.id === tabId);
          const next = prev.filter(tb => tb.id !== tabId);
          if (next.length === 0) {
            // never empty — re-add home
            const home = { ...initialTab, id: "t-home-" + Date.now().toString(36) };
            setActiveTabId(home.id);
            return [home];
          }
          if (tabId === activeTabId) {
            const fallback = next[Math.max(0, idx - 1)];
            setActiveTabId(fallback.id);
          }
          return next;
        });
      };

      // ---- Setters used by NavRail (replace current tab if static, else create new) ----
      const goToScreen = (screenId) => {
        const isStaticScreen = ["home", "company", "projects", "skills", "reports", "labor", "files", "settings"].includes(screenId);
        if (!isStaticScreen) return;
        const labels = { home:"Home", company:"Company", projects:"Projects", skills:"Skills", reports:"Reports", labor:"Labor rates", files:"Files", settings:"Settings" };
        const icons  = { home:"home", company:"domain", projects:"folder_open", skills:"auto_awesome", reports:"assessment", labor:"engineering", files:"folder_copy", settings:"tune" };
        // Workspace nav items don't open as separate tabs — they replace
        // the content of the current active tab (unless that tab is a
        // project / skill-run / drawing, which we want to preserve).
        const active = tabs.find(tb => tb.id === activeTabId);
        const preserveKinds = ["project", "skill", "drawing"];
        if (active && !preserveKinds.includes(active.kind)) {
          setTabs(prev => prev.map(tb => tb.id === activeTabId ? {
            ...tb,
            kind: "static",
            screen: screenId,
            ctx: { section: "overview", filter: "all" },
            label: labels[screenId],
            icon: icons[screenId]
          } : tb));
          return;
        }
        // If active tab is a project/skill/drawing, find or create the static tab
        const existing = tabs.find(tb => tb.kind === "static" && tb.screen === screenId);
        if (existing) { setActiveTabId(existing.id); return; }
        addTab({
          kind: "static",
          screen: screenId,
          ctx: { section: "overview", filter: "all" },
          label: labels[screenId],
          icon: icons[screenId]
        });
      };

      // Open a workspace screen in a brand-new tab (bypasses goToScreen's replace/switch logic)
      const openScreenInNewTab = (screenId) => {
        const isStaticScreen = ["home", "company", "projects", "skills", "reports", "labor", "files", "settings"].includes(screenId);
        if (!isStaticScreen) return;
        const labels = { home:"Home", company:"Company", projects:"Projects", skills:"Skills", reports:"Reports", labor:"Labor rates", files:"Files", settings:"Settings" };
        const icons  = { home:"home", company:"domain", projects:"folder_open", skills:"auto_awesome", reports:"assessment", labor:"engineering", files:"folder_copy", settings:"tune" };
        addTab({
          kind: "static",
          screen: screenId,
          ctx: { section: "overview", filter: "all" },
          label: labels[screenId],
          icon: icons[screenId],
          force: true
        });
      };

      const onPin = (id) => {
        setPinned(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };

      // ---- Open project — opens a dedicated project tab ----
      const openProject = (id, opts = {}) => {
        const proj = projects.find(p => p.id === id);
        if (!proj) return;
        const tab = opts.tab || "overview";
        // Skill results show only the skill name in the tab; other tabs append the section to the project name.
        const skillLabels = {
          estimation: "Rough Order of Magnitude (ROM) Estimate",
          rfc: "Clarifications & Potential RFIs",
          bid: "Bid Level Analysis",
          trades: "Trade Scoping"
        };
        const tabLabels = { overview:"", files:": Files", skills:": Skills", reports:": Reports", schedule:": Schedule" };
        const label = skillLabels[tab] || (proj.name + (tabLabels[tab] || ""));
        // Skill-result tabs carry the skill's own icon; everything else uses
        // the project's folder icon.
        const skillTabIcons = { estimation: "calculate", rfc: "rule", bid: "compare_arrows", trades: "groups" };
        const tabIcon = skillTabIcons[tab] || (proj.icon || "folder_open");
        addTab({
          kind: "project",
          screen: "project",
          ctx: { projectId: id, tab },
          label,
          subLabel: proj.kind,
          icon: tabIcon,
          projectId: id,
          force: !!opts.force
        });
      };

      // ---- Switch active project tab to a different project (in place) ----
      const switchProjectInTab = (newProjectId) => {
        const proj = projects.find(p => p.id === newProjectId);
        if (!proj || activeTab.kind !== "project") {
          openProject(newProjectId);
          return;
        }
        updateActiveTab({
          label: proj.name,
          subLabel: proj.kind,
          icon: proj.icon || "folder_open",
          projectId: newProjectId,
          ctx: { ...activeTab.ctx, projectId: newProjectId }
        });
      };

      const openProjectInNewTab = (id) => openProject(id, { force: true });

      const openProjectTab = (tabId) => {
        // Open the project sub-tab in its own dedicated tab (dedupes via addTab).
        if (!activeTab.projectId) return;
        openProject(activeTab.projectId, { tab: tabId });
      };

      const openNewProject = () => setShowNewProject(true);

      const createProject = ({ name, kind, address, scope, filesCount, files }) => {
        const id = "proj-" + Date.now().toString(36);
        const today = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        const fileNames = Array.isArray(files) ? files : [];
        const newProject = {
          id, name,
          kind: kind + " · New",
          icon: "folder_open",
          status: "draft", statusLabel: "Draft",
          lastEdit: "Just now", progress: 0,
          address: address || "N/A", stage: "Pre-design", scope: scope || "", estimate: "N/A",
          files: filesCount || fileNames.length || 0,
          isNew: true,
          revisions: [{ id: "rev1", name: "Revision 1: Initial upload", date: today, note: "Initial project files" }],
        };
        setProjects(prev => [newProject, ...prev]);
        // Seed the new project's file tree (used by Files tab + workspace Files)
        const fileEntries = fileNames.map((n, i) => {
          const ext = (n.split(".").pop() || "file").toLowerCase();
          return {
            id: id + "-f-" + i,
            name: n,
            size: "N/A",
            sizeBytes: 0,
            ftype: ext,
            uploaded: today,
            uploadedBy: data.user.name,
            revisionId: "rev1",
          };
        });
        setFilesByProject(prev => ({ ...prev, [id]: fileEntries }));
        setShowNewProject(false);
        // openProject() would read from the stale projects closure and miss the
        // just-added project. Open its overview tab directly using newProject.
        addTab({
          kind: "project",
          screen: "project",
          ctx: { projectId: id, tab: "overview" },
          label: newProject.name,
          subLabel: newProject.kind,
          icon: newProject.icon || "folder_open",
          projectId: id,
        });
      };

      // ---- Skill run as its own tab (with progress in tab title) ----
      const runSkill = (skillId, projectId) => {
        const skill = skills.find(s => s.id === skillId);
        const proj = projects.find(p => p.id === projectId) || projects[0];
        if (!skill) return;
        const tabId = "t-run-" + Date.now().toString(36);
        const newTab = {
          id: tabId,
          kind: "skill",
          screen: "skill-run",
          ctx: { projectId: proj.id, skillId, tab: skillId === "estimation" ? "estimation" : skillId === "rfc-issues" ? "rfc" : skillId === "trade-scoping" ? "trades" : "bid" },
          label: skill.title + ": " + proj.name,
          subLabel: "Running…",
          icon: skill.icon || "auto_awesome",
          projectId: proj.id,
          runStatus: "running",
          runProgress: 0
        };
        setTabs(prev => [...prev, newTab]);
        setActiveTabId(tabId);
        // Simulate progress
        let p = 0;
        const tick = () => {
          p += 0.04 + Math.random() * 0.06;
          if (p >= 1) {
            const subTab = skillId === "estimation" ? "estimation" : skillId === "rfc-issues" ? "rfc" : skillId === "trade-scoping" ? "trades" : "bid";
            const skillLabels = { estimation: "Rough Order of Magnitude (ROM) Estimate", rfc: "Clarifications & Potential RFIs", bid: "Bid Level Analysis", trades: "Trade Scoping" };
            updateTab(tabId, { runProgress: 1, runStatus: "done", subLabel: "Done", screen: "project", kind: "project", ctx: { projectId: proj.id, tab: subTab }, label: skillLabels[subTab] });
            return;
          }
          updateTab(tabId, { runProgress: p });
          setTimeout(tick, 700 + Math.random() * 600);
        };
        setTimeout(tick, 600);
      };

      // ---- Drawings ----
      const openDrawing = (drawingId, projectId) => {
        const proj = projects.find(p => p.id === (projectId || activeTab.projectId)) || projects[0];
        const drawing = data.drawings.find(d => d.id === drawingId);
        if (!drawing) return;
        addTab({
          kind: "drawing",
          screen: "drawing",
          ctx: { projectId: proj.id, drawingId },
          label: drawing.id + ": " + drawing.title,
          subLabel: drawing.trade,
          icon: "architecture",
          projectId: proj.id
        });
      };

      const switchDrawing = (drawing) => {
        const proj = projects.find(p => p.id === activeTab.projectId);
        updateActiveTab({
          ctx: { ...activeTab.ctx, drawingId: drawing.id },
          label: drawing.id + ": " + drawing.title,
          subLabel: drawing.trade
        });
      };

      const popOutDrawing = () => {
        const drawing = data.drawings.find(d => d.id === activeTab.ctx.drawingId);
        const proj = projects.find(p => p.id === activeTab.projectId);
        setDrawingViewer({ drawing, project: proj });
      };

      // ---- Pinned items as nav entries ----
      const pinnedItems = useMemo(() => {
        const arr = [];
        for (const id of pinned) {
          const p = projects.find(p => p.id === id);
          if (p) { arr.push({ id: p.id, label: p.name, icon: p.icon || "folder_open", kind: "project" }); continue; }
          // Some pinned ids are non-project recommendations from Home
          if (id === "rec-wellness") arr.push({ id, label: "Wellness Center bid", icon: "favorite_border", kind: "rec" });
        }
        return arr;
      }, [pinned, projects]);

      const onOpenPinned = (p) => {
        if (p.kind === "project") openProject(p.id);
      };

      // ---- Connections (used by AddConnectionModal + nav rail) ----
      // Seeded with the two integrations the nav showed before. Each value can
      // hold metadata for richer status (logo, brand color) so the nav rail
      // doesn't need its own catalog.
      const [connections, setConnections] = useState(freshMode ? {} : {
        bluebeam: { id: "bluebeam", name: "Bluebeam Revu", icon: "draw",   brand: "#1B6EC7", domain: "bluebeam.com", category: "Construction", desc: "PDF markup, takeoffs, and quantification." },
        procore:  { id: "procore",  name: "Procore",       icon: "domain", brand: "#F7941E", domain: "procore.com",  category: "Construction", desc: "Project management, drawings, and submittals." },
      });
      const [showAddConnection, setShowAddConnection] = useState(false);
      const onAddConnection = () => setShowAddConnection(true);
      const toggleConnection = (id, shouldConnect, meta) => {
        setConnections(prev => {
          const next = { ...prev };
          if (shouldConnect) {
            next[id] = meta
              ? { id: meta.id, name: meta.name, icon: meta.icon, brand: meta.brand, domain: meta.domain, category: meta.category, desc: meta.desc }
              : { id };
          } else {
            delete next[id];
          }
          return next;
        });
      };

      const onAskAI = () => setAiOpen(true);

      // ---- Cody guided flows triggered from the Home greeting ----
      // pendingAction is consumed by <AIAssistant> via a useEffect — every new
      // trigger gets a fresh token so the same action can fire repeatedly.
      const [pendingAction, setPendingAction] = useState(null); // { id, token, payload }
      const triggerCody = (id, payload) => {
        setAiOpen(true);
        setPendingAction({ id, token: Date.now(), payload });
      };
      const askCodyPrompt = (text) => triggerCody("free-text", text);
      const startCreateProjectFlow = () => triggerCody("create-project");
      const startAddFilesFlow = () => triggerCody("add-files");
      const startRomEstimateFlow = () => triggerCody("rom-estimate");
      const onToggleTheme = () => {
        const next = t.theme === "light" ? "hybrid" : t.theme === "hybrid" ? "dark" : "light";
        setTweak("theme", next);
      };

      // ---- DETAIL ROUTING (column 3) ----
      const activeProject = activeTab.projectId ? projects.find(p => p.id === activeTab.projectId) : null;
      const screen = activeTab.screen;
      const ctx = activeTab.ctx || {};

      let detail = null;
      if (activeTab.kind === "drawing") {
        const drawing = data.drawings.find(d => d.id === ctx.drawingId);
        detail = (
          <DrawingViewer
            drawing={drawing}
            project={activeProject || projects[0]}
            onClose={() => closeTab(activeTab.id)}
            onSwitchSheet={switchDrawing}
            onPopOut={popOutDrawing}
            onOpenCost={() => openProjectTab("estimation")}
            pinnedSet={pinned}
            onPin={onPin}
          />
        );
      } else if (screen === "home") detail = <HomeScreen ctx={ctx} projects={projects} runs={runs} pinnedSet={pinned} onPin={onPin} onOpenProject={openProject} onOpenProjectInNewTab={openProjectInNewTab} onOpenDrawing={openDrawing} onAskAI={onAskAI} onNewProject={openNewProject} onOpenDailyReport={() => setShowDailyReport(true)} onCtxMenu={openCtxMenu} onAskCodyPrompt={askCodyPrompt} onStartCreateProjectFlow={startCreateProjectFlow} onStartAddFilesFlow={startAddFilesFlow} onStartRomEstimateFlow={startRomEstimateFlow} freshMode={freshMode} user={data.user} onFuxFullyComplete={onFuxFullyComplete} />;
      else if (screen === "projects") detail = <ProjectsScreen ctx={ctx} projects={projects} pinnedSet={pinned} onPin={onPin} onOpen={openProject} onOpenInNewTab={openProjectInNewTab} onAskAI={onAskAI} onNewProject={openNewProject} onCtxMenu={openCtxMenu} />;
      else if (screen === "skills") detail = <SkillRunScreen project={projects[0]} ctx={ctx} setCtx={updateActiveTab} onAskAI={onAskAI} onRunSkill={runSkill} />;
      else if (screen === "reports") detail = <ReportsScreen ctx={ctx} onAskAI={onAskAI} />;
      else if (screen === "labor") detail = <LaborScreen ctx={ctx} onAskAI={onAskAI} />;
      else if (screen === "company") detail = <CompanyScreen ctx={ctx} onAskAI={onAskAI} onOpenProject={openProject} projects={projects} approvals={approvals} onResolveApproval={resolveApproval} />;
      else if (screen === "files") detail = <WorkspaceFilesScreen ctx={ctx} onAskAI={onAskAI} projects={projects} filesByProject={filesByProject} onDeleteFile={requestDeleteFile} onCtxMenu={openCtxMenu} />;
      else if (screen === "settings") detail = <SettingsScreen ctx={ctx} onAskAI={onAskAI} theme={t.theme} onToggleTheme={onToggleTheme} connections={connections} onAddConnection={onAddConnection} onToggleConnection={toggleConnection} divisionFormat={t.divisionFormat || "masterformat"} divisionFormatOther={t.divisionFormatOther || ""} onSetDivisionFormat={(v) => setTweak("divisionFormat", v)} onSetDivisionFormatOther={(v) => setTweak("divisionFormatOther", v)} />;
      else if (screen === "project" || screen === "skill-run") {
        const p = activeProject || projects[0];
        const tab = ctx.tab || "overview";
        const projectSwitcher = (
          <ProjectSwitcher
            project={p}
            projects={projects}
            recentProjects={recentProjects}
            onSwitch={switchProjectInTab}
            onOpenInTab={openProjectInNewTab}
          />
        );
        if (tab === "overview") detail = <ProjectHomeScreen project={p} onOpenTab={openProjectTab} onOpenTabInNewTab={(t) => openProject(p.id, { tab: t, force: true })} onAskAI={onAskAI} onOpenDrawing={openDrawing} projectSwitcher={projectSwitcher} pinnedSet={pinned} onPin={onPin} skillRuns={skillRuns} skillCompletions={skillCompletions} onStartSkillRun={startSkillRunCard} onStopSkillRun={stopSkillRunCard} onConfigureBid={openBidRunModal} onCtxMenu={openCtxMenu} editMode={editMode} setEditMode={setEditMode} edits={edits} recordEdit={recordEdit} revertEdits={revertEdits} editCount={editCount} onPushGlobal={() => setShowPushGlobal(true)} divisionFormat={t.divisionFormat || "masterformat"} divisionFormatOther={t.divisionFormatOther || ""} hasPendingEdits={hasPendingEdits} onPushToMaster={openPushToMaster} onOpenNotifications={openActivityPopover} notificationCount={((data.projectActivity && data.projectActivity[p.id]) || []).filter(a => a.kind === "editing").length + approvals.filter(a => a.status === "pending" && a.projectId === p.id).length} bidsByProject={bidsByProject} suggestedSubsByProject={suggestedSubsByProject} onAddBid={addBid} onUpdateBid={updateBid} onDeleteBid={deleteBid} onOpenInviteToBid={openInviteToBid} onUpdateSuggestedCount={updateSuggestedCount} />;
        else if (tab === "files") detail = <FilesScreen project={p} onAskAI={onAskAI} onOpenDrawing={openDrawing} projectSwitcher={projectSwitcher} />;
        else if (tab === "skills") detail = <SkillRunScreen project={p} ctx={ctx} setCtx={updateActiveTab} onAskAI={onAskAI} onRunSkill={runSkill} projectSwitcher={projectSwitcher} />;
        else if (tab === "estimation") detail = <EstimationScreen project={p} onAskAI={onAskAI} onOpenDrawing={openDrawing} projectSwitcher={projectSwitcher} pinnedSet={pinned} onPin={onPin} isLoading={!!skillRuns[p.id + "/estimation"]} loadProgress={(skillRuns[p.id + "/estimation"] || {}).progress || 0} onRerun={() => startSkillRunCard(p.id, "estimation")} onStop={() => stopSkillRunCard(p.id, "estimation")} editMode={editMode} setEditMode={setEditMode} edits={edits} recordEdit={recordEdit} revertEdits={revertEdits} editCount={editCount} onPushGlobal={() => setShowPushGlobal(true)} hasPendingEdits={hasPendingEdits} onPushToMaster={openPushToMaster} onOpenNotifications={openActivityPopover} notificationCount={((data.projectActivity && data.projectActivity[p.id]) || []).filter(a => a.kind === "editing").length + approvals.filter(a => a.status === "pending" && a.projectId === p.id).length} />;
        else if (tab === "rfc") detail = <RFCScreen project={p} onAskAI={onAskAI} onOpenDrawing={openDrawing} projectSwitcher={projectSwitcher} pinnedSet={pinned} onPin={onPin} isLoading={!!skillRuns[p.id + "/rfc"]} loadProgress={(skillRuns[p.id + "/rfc"] || {}).progress || 0} onRerun={() => startSkillRunCard(p.id, "rfc")} onStop={() => stopSkillRunCard(p.id, "rfc")} editMode={editMode} setEditMode={setEditMode} edits={edits} recordEdit={recordEdit} revertEdits={revertEdits} editCount={editCount} onPushGlobal={() => setShowPushGlobal(true)} hasPendingEdits={hasPendingEdits} onPushToMaster={openPushToMaster} onOpenNotifications={openActivityPopover} notificationCount={((data.projectActivity && data.projectActivity[p.id]) || []).filter(a => a.kind === "editing").length + approvals.filter(a => a.status === "pending" && a.projectId === p.id).length} />;
        else if (tab === "bid") detail = <BidLevelingScreen project={p} onAskAI={onAskAI} projectSwitcher={projectSwitcher} pinnedSet={pinned} onPin={onPin} isLoading={!!skillRuns[p.id + "/bid"]} loadProgress={(skillRuns[p.id + "/bid"] || {}).progress || 0} onRerun={() => startSkillRunCard(p.id, "bid")} onStop={() => stopSkillRunCard(p.id, "bid")} editMode={editMode} setEditMode={setEditMode} edits={edits} recordEdit={recordEdit} revertEdits={revertEdits} editCount={editCount} onPushGlobal={() => setShowPushGlobal(true)} hasPendingEdits={hasPendingEdits} onPushToMaster={openPushToMaster} onOpenNotifications={openActivityPopover} notificationCount={((data.projectActivity && data.projectActivity[p.id]) || []).filter(a => a.kind === "editing").length + approvals.filter(a => a.status === "pending" && a.projectId === p.id).length} />;
        else if (tab === "trades") detail = <TradeScopingScreen project={p} onAskAI={onAskAI} projectSwitcher={projectSwitcher} pinnedSet={pinned} onPin={onPin} isLoading={!!skillRuns[p.id + "/trades"]} loadProgress={(skillRuns[p.id + "/trades"] || {}).progress || 0} onRerun={() => startSkillRunCard(p.id, "trades")} onStop={() => stopSkillRunCard(p.id, "trades")} hasPendingEdits={hasPendingEdits} onPushToMaster={openPushToMaster} onOpenNotifications={openActivityPopover} notificationCount={((data.projectActivity && data.projectActivity[p.id]) || []).filter(a => a.kind === "editing").length + approvals.filter(a => a.status === "pending" && a.projectId === p.id).length} onOpenInviteToBid={openInviteToBid} />;
        else if (tab === "reports") detail = <ReportsScreen ctx={ctx} onAskAI={onAskAI} projectSwitcher={projectSwitcher} />;
        else if (tab === "schedule") detail = <SkillRunScreen project={p} ctx={ctx} setCtx={updateActiveTab} onAskAI={onAskAI} onRunSkill={runSkill} projectSwitcher={projectSwitcher} />;
      }

      // ---- Recently visited (from history excluding workspace nav items) ----
      const recentlyVisited = (() => {
        const fromHistory = tabHistory
          .filter(h => h.key !== activeTabId)
          .filter(h => {
            const tb = tabs.find(t => t.id === h.key);
            return tb && tb.kind !== "static";
          })
          .slice(0, 4);
        if (fromHistory.length > 0) return fromHistory;
        // In fresh-user mode there's no workspace to seed against — leave
        // the Recently Visited section empty so it doesn't appear in the nav.
        if (freshMode) return [];
        // Fallback seed — recent skill results across the user's pinned projects
        // so the section never reads as empty on a fresh session.
        return [
          { key: "seed-est",      label: "ROM Estimate",        subLabel: "Recreational Wellness", icon: "calculate",       onClick: () => openProject("rec-wellness", { tab: "estimation" }) },
          { key: "seed-rfc",      label: "Clarifications & RFIs", subLabel: "Recreational Wellness", icon: "rule",          onClick: () => openProject("rec-wellness", { tab: "rfc" }) },
          { key: "seed-bid",      label: "Bid Level Analysis",  subLabel: "Rivergrove Residences", icon: "compare_arrows",  onClick: () => openProject("rivergrove", { tab: "bid" }) },
          { key: "seed-drawing",  label: "A-101 Level 1 plan", subLabel: "Recreational Wellness", icon: "architecture", onClick: () => openDrawing("A-101", "rec-wellness") },
        ];
      })();

      // Recent projects = most-recently-visited project tabs, deduped by projectId.
      // Falls back to the first 4 non-archived projects when there's no history yet,
      // so the nav rail section never appears empty on a fresh session.
      const recentProjects = useMemo(() => {
        const seen = new Set();
        const out = [];
        for (const h of tabHistory) {
          const tb = tabs.find(t => t.id === h.key);
          if (!tb || tb.kind !== "project" || !tb.projectId) continue;
          if (seen.has(tb.projectId)) continue;
          seen.add(tb.projectId);
          const p = projects.find(p => p.id === tb.projectId);
          if (p) out.push(p);
        }
        // Add active project if any
        if (activeTab.kind === "project" && activeTab.projectId && !seen.has(activeTab.projectId)) {
          const p = projects.find(p => p.id === activeTab.projectId);
          if (p) out.unshift(p);
        }
        if (out.length === 0) {
          // Seed the rail on first load with the most relevant projects so the
          // "Recent projects" group always has content.
          for (const p of projects) {
            if (p.archived) continue;
            out.push(p);
            if (out.length >= 4) break;
          }
        }
        return out.slice(0, 4);
      }, [tabHistory, tabs, projects, activeTabId]);

      const newTabFromButton = () => goToScreen("home");

      return (
        <div className="app" data-density={t.density} data-no-list="true" data-ai-open={aiOpen} data-nav-collapsed={navCollapsed} data-fux-panels-hidden={fuxPanelsHidden}>
          <NavRail
            screen={screen}
            setScreen={goToScreen}
            setScreenInNewTab={openScreenInNewTab}
            user={data.user}
            onToggleTheme={onToggleTheme}
            theme={t.theme}
            recentlyVisited={recentlyVisited}
            recentProjects={recentProjects}
            onOpenProject={openProject}
            onOpenProjectInNewTab={openProjectInNewTab}
            onOpenSettings={() => goToScreen("settings")}
            pinnedItems={pinnedItems}
            onOpenPinned={onOpenPinned}
            onAddConnection={onAddConnection}
            onCtxMenu={openCtxMenu}
            connections={connections}
            collapsed={navCollapsed}
            onToggleCollapsed={toggleNavCollapsed}
            freshMode={freshMode}
            onToggleFreshMode={toggleFreshMode}
          />
          <div className="col-detail-wrap">
            <TabBar
              tabs={tabs}
              activeId={activeTabId}
              onActivate={setActiveTabId}
              onClose={closeTab}
              onNewTab={newTabFromButton}
              onToggleNav={toggleNavCollapsed}
              navCollapsed={navCollapsed}
            />
            <div className="col-detail-body">
              {detail}
            </div>
          </div>

          {/* AI Assistant — docked right rail */}
          <AIAssistant
            open={aiOpen}
            onClose={() => setAiOpen(false)}
            onOpen={() => setAiOpen(true)}
            context={{ screen, ctx, project: activeProject }}
            projects={projects}
            pendingAction={pendingAction}
            onOpenProject={openProject}
            onOpenProjectTabInNewTab={(id, tab) => openProject(id, { tab, force: true })}
            onStartSkillRun={startSkillRunCard}
            onConfigureBid={openBidRunModal}
            onConfigureRom={openRomRunModal}
          />

          <TweaksPanel>
            <TweakSection label="Theme" />
            <TweakRadio label="Mode" value={t.theme} options={[{value:"dark",label:"Dark"},{value:"hybrid",label:"Hybrid"},{value:"light",label:"Light"}]}
                        onChange={(v) => setTweak("theme", v)} />
            <TweakSection label="Layout" />
            <TweakRadio label="Density" value={t.density}
                        options={[{value:"compact",label:"Compact"},{value:"regular",label:"Regular"},{value:"roomy",label:"Roomy"}]}
                        onChange={(v) => setTweak("density", v)} />
            <TweakSection label="Permissions" />
            <TweakRadio label="Demo role" value={data.user.role || "admin"}
                        options={[{value:"admin",label:"Admin"},{value:"collaborator",label:"Collaborator"},{value:"viewer",label:"Viewer"}]}
                        onChange={(v) => { data.user.role = v; setTweak("__roleBump", (Date.now())); }} />
          </TweaksPanel>

          <NewProjectModal
            open={showNewProject}
            onClose={() => setShowNewProject(false)}
            onCreate={createProject}
          />

          <DailyReportModal
            open={showDailyReport}
            onClose={() => setShowDailyReport(false)}
            projects={projects}
          />

          <PushGlobalModal
            open={showPushGlobal}
            onClose={() => setShowPushGlobal(false)}
            onConfirm={confirmPushGlobal}
            edits={edits}
          />

          <DeleteFileModal
            open={!!pendingDelete}
            file={pendingDelete}
            onClose={() => setPendingDelete(null)}
            onConfirm={confirmDeleteFile}
          />

          <AddConnectionModal
            open={showAddConnection}
            onClose={() => setShowAddConnection(false)}
            connections={connections}
            onToggleConnection={toggleConnection}
          />

          <RunBidAnalysisModal
            open={showBidRunModal}
            onClose={() => { setShowBidRunModal(false); skillConfirmRef.current = null; }}
            onConfirm={confirmBidRun}
            project={projects.find(p => p.id === bidRunProjectId)}
            bidConfig={bidRunProjectId ? bidConfigByProject[bidRunProjectId] : null}
          />

          <RunRomEstimateModal
            open={showRomRunModal}
            onClose={() => { setShowRomRunModal(false); skillConfirmRef.current = null; }}
            onConfirm={confirmRomRun}
            project={projects.find(p => p.id === romRunProjectId)}
          />

          <InviteToBidModal
            open={inviteToBidState.open}
            onClose={closeInviteToBid}
            project={projects.find(p => p.id === inviteToBidState.projectId)}
            trades={inviteToBidState.trades}
            currentBids={inviteToBidState.projectId ? (bidsByProject[inviteToBidState.projectId] || []) : []}
            suggestedCounts={inviteToBidState.projectId ? (suggestedSubsByProject[inviteToBidState.projectId] || {}) : {}}
            onUpdateSuggestedCount={updateSuggestedCount}
            onSubmit={(entries) => { submitInviteToBid(inviteToBidState.projectId, entries); closeInviteToBid(); }}
          />

          <PushToMasterModal
            open={!!pushModal}
            onClose={closePushToMaster}
            project={pushModal ? projects.find(p => p.id === pushModal.projectId) : null}
            changes={pushModal ? (hasPendingEdits[pushModal.projectId] || []) : []}
            user={data.user}
            onSubmit={(bundle) => {
              if (pushModal) submitForApproval(pushModal.projectId, bundle);
              closePushToMaster();
            }}
          />

          {activityPopover && (
            <div className="activity-popover-anchor">
              <ProjectActivityPopover
                open={!!activityPopover}
                onClose={closeActivityPopover}
                projectId={activityPopover.projectId}
                projectName={(projects.find(p => p.id === activityPopover.projectId) || {}).name}
                activity={(data.projectActivity && data.projectActivity[activityPopover.projectId]) || []}
                approvals={approvals}
                members={data.companyMembers || []}
              />
            </div>
          )}

          <ContextMenu menu={ctxMenu} onClose={closeCtxMenu} />

          {/* Prototype disclaimer ticker — pinned to the bottom of the main
              canvas area, scrolling right-to-left continuously. */}
          <div className="news-ticker" role="status" aria-live="off">
            <div className="news-ticker-track">
              <span>This prototype is incomplete and not in the process of being implemented.</span>
              <span>This prototype is incomplete and not in the process of being implemented.</span>
              <span>This prototype is incomplete and not in the process of being implemented.</span>
              <span>This prototype is incomplete and not in the process of being implemented.</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
